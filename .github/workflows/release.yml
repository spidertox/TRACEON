name: Release

# Publishes an installable APK to GitHub Releases.
#   * push a tag like v0.1.0            -> builds and publishes that version
#   * Actions -> Release -> Run workflow -> enter 0.1.0 (the tag v0.1.0 is created for you)
# With signing secrets set (see docs/RELEASE.md) the APK is signed with your key. Without them a debug-signed
# APK is published as a pre-release so the pipeline works from day one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.1 (tag v<version> will be created)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Work out version
        id: ver
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then VERSION="${INPUT_VERSION#v}"; else VERSION="${REF_NAME#v}"; fi
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3 or 1.2.3-rc1"
            exit 1
          fi
          MA="${BASH_REMATCH[1]}"; MI="${BASH_REMATCH[2]}"; PA="${BASH_REMATCH[3]}"
          if [ "$MI" -gt 99 ] || [ "$PA" -gt 99 ]; then
            echo "::error::minor and patch must be 99 or less (versionCode = major*10000 + minor*100 + patch)"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
            echo "code=$((MA * 10000 + MI * 100 + PA))"
            if [[ "$VERSION" == *-* ]]; then echo "pre=true"; else echo "pre=false"; fi
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Unit tests (a failing test blocks the release)
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Check signing secrets
        id: sign
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets are not set - publishing a debug-signed PRE-RELEASE. See docs/RELEASE.md."
          fi

      - name: Build APK
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          VERSION: ${{ steps.ver.outputs.version }}
          CODE: ${{ steps.ver.outputs.code }}
          TRACEON_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          TRACEON_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TRACEON_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TRACEON_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$SIGNED" = "true" ]; then
            gradle :app:assembleRelease -PappVersionName="$VERSION" -PappVersionCode="$CODE" --stacktrace
            cp app/build/outputs/apk/release/app-release.apk "TRACEON-v${VERSION}.apk"
          else
            gradle :app:assembleDebug -PappVersionName="$VERSION" -PappVersionCode="$CODE" --stacktrace
            cp app/build/outputs/apk/debug/app-debug.apk "TRACEON-v${VERSION}-debug.apk"
          fi
          ls -l TRACEON-*.apk

      - name: Verify signature
        if: steps.sign.outputs.signed == 'true'
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --verbose --print-certs "TRACEON-v${VERSION}.apk"

      - name: Checksums and release notes
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          sha256sum TRACEON-*.apk > SHA256SUMS.txt
          {
            echo "## TRACEON ${TAG}"
            echo
            echo "**Install:** download the APK below on your Android phone and open it (allow *Install unknown apps* for your browser or file manager)."
            echo
            echo "**Integrity:** SHA-256 checksums are in \`SHA256SUMS.txt\`."
            echo
            if [ "$SIGNED" = "true" ]; then
              echo "Signed with the maintainer release key. Later releases signed with the same key update this one in place."
            else
              echo "> Debug-signed build (no release signing key was configured). Fine for trying the app; it installs as \`com.traceon.debug\` and is not an upgrade path."
            fi
            echo
            echo "Early (0.x) software: see docs/LIMITATIONS.md for what it can and cannot do."
          } > release-notes.md
          cat SHA256SUMS.txt

      - name: Keep a copy as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceon-apk
          path: |
            TRACEON-*.apk
            SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: TRACEON ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.pre == 'true' || steps.sign.outputs.signed != 'true' }}
          fail_on_unmatched_files: true
          files: |
            TRACEON-*.apk
            SHA256SUMS.txt
